[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fulcrum"
version = "0.3.0"
description = "Local coordination infrastructure for durable agent workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Derek Thurn" }]
dependencies = [
  "ruamel.yaml==0.19.1",
  "watchfiles==1.1.0",
]

[tool.setuptools.data-files]
"share/fulcrum/skills/fulcrum-bootstrap" = ["skills/fulcrum-bootstrap/SKILL.md"]
"share/fulcrum/skills/fulcrum-bootstrap/agents" = ["skills/fulcrum-bootstrap/agents/openai.yaml"]
"share/fulcrum/skills/fulcrum-vizier" = ["skills/fulcrum-vizier/SKILL.md"]
"share/fulcrum/skills/fulcrum-vizier/agents" = ["skills/fulcrum-vizier/agents/openai.yaml"]
"share/fulcrum/skills/fulcrum-marshal" = ["skills/fulcrum-marshal/SKILL.md"]
"share/fulcrum/skills/fulcrum-marshal/agents" = ["skills/fulcrum-marshal/agents/openai.yaml"]
"share/fulcrum/skills/weaver" = ["skills/weaver/SKILL.md"]
"share/fulcrum/skills/weaver/agents" = ["skills/weaver/agents/openai.yaml"]
"share/fulcrum/skills/fulcrum-executor" = ["skills/fulcrum-executor/SKILL.md"]
"share/fulcrum/skills/fulcrum-executor/agents" = ["skills/fulcrum-executor/agents/openai.yaml"]
"share/fulcrum/skills/fulcrum-warden" = ["skills/fulcrum-warden/SKILL.md"]
"share/fulcrum/skills/fulcrum-warden/agents" = ["skills/fulcrum-warden/agents/openai.yaml"]
"share/fulcrum/skills/fulcrum-sage" = ["skills/fulcrum-sage/SKILL.md"]
"share/fulcrum/skills/fulcrum-sage/agents" = ["skills/fulcrum-sage/agents/openai.yaml"]
"share/fulcrum/skills/fulcrum-mason" = ["skills/fulcrum-mason/SKILL.md"]
"share/fulcrum/skills/fulcrum-mason/agents" = ["skills/fulcrum-mason/agents/openai.yaml"]
"share/fulcrum/skills/fulcrum-justiciar" = ["skills/fulcrum-justiciar/SKILL.md"]
"share/fulcrum/skills/fulcrum-justiciar/agents" = ["skills/fulcrum-justiciar/agents/openai.yaml"]
"share/fulcrum/skills/fulcrum-bead" = ["skills/fulcrum-bead/SKILL.md"]
"share/fulcrum/skills/fulcrum-bead/agents" = ["skills/fulcrum-bead/agents/openai.yaml"]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "pyre-check==0.10.0",
]

[project.scripts]
fulcrum = "fulcrum.bootstrap:main"
fulcrum-broker = "fulcrum.broker:main"
fulcrum-mcp = "fulcrum.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
