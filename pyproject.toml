[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fulcrum"
version = "0.2.0"
description = "Local coordination infrastructure for durable agent workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Derek Thurn" }]
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "pyre-check==0.10.0",
]

[project.scripts]
fulcrum = "fulcrum.cli:main"
fulcrum-hook = "fulcrum.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/fulcrum/schemas" = ["schemas/*.json"]
"share/fulcrum/skills/archon" = ["skills/archon/*.md"]
"share/fulcrum/skills/weaver" = ["skills/weaver/*.md"]
"share/fulcrum/skills/overseer" = ["skills/overseer/*.md"]
"share/fulcrum/skills/executor" = ["skills/executor/*.md"]
"share/fulcrum/skills/night-watchman" = ["skills/night-watchman/*.md"]
"share/fulcrum/skills/sage" = ["skills/sage/*.md"]
"share/fulcrum/skills/inquisitor" = ["skills/inquisitor/*.md"]
"share/fulcrum/skills/shared" = ["skills/shared/*.md"]

[tool.black]
line-length = 88
target-version = ["py312"]
