[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fulcrum"
version = "0.3.0"
description = "Local coordination infrastructure for durable agent workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Derek Thurn" }]
dependencies = [
  "ruamel.yaml==0.19.1",
  "watchfiles==1.1.0",
]

[tool.setuptools.data-files]
"share/fulcrum/skills/bead" = ["skills/bead/SKILL.md"]
"share/fulcrum/skills/bead/agents" = ["skills/bead/agents/openai.yaml"]
"share/fulcrum/skills/bootstrap" = ["skills/bootstrap/SKILL.md"]
"share/fulcrum/skills/bootstrap/agents" = ["skills/bootstrap/agents/openai.yaml"]
"share/fulcrum/skills/executor" = ["skills/executor/SKILL.md"]
"share/fulcrum/skills/executor/agents" = ["skills/executor/agents/openai.yaml"]
"share/fulcrum/skills/justiciar" = ["skills/justiciar/SKILL.md"]
"share/fulcrum/skills/justiciar/agents" = ["skills/justiciar/agents/openai.yaml"]
"share/fulcrum/skills/marshal" = ["skills/marshal/SKILL.md"]
"share/fulcrum/skills/marshal/agents" = ["skills/marshal/agents/openai.yaml"]
"share/fulcrum/skills/mason" = ["skills/mason/SKILL.md"]
"share/fulcrum/skills/mason/agents" = ["skills/mason/agents/openai.yaml"]
"share/fulcrum/skills/postmortem" = ["skills/postmortem/SKILL.md"]
"share/fulcrum/skills/postmortem/agents" = ["skills/postmortem/agents/openai.yaml"]
"share/fulcrum/skills/postmortem/references" = ["skills/postmortem/references/report-structure.md"]
"share/fulcrum/skills/postmortem/scripts" = ["skills/postmortem/scripts/collect_evidence.py"]
"share/fulcrum/skills/sage" = ["skills/sage/SKILL.md"]
"share/fulcrum/skills/sage/agents" = ["skills/sage/agents/openai.yaml"]
"share/fulcrum/skills/uninstall" = ["skills/uninstall/SKILL.md"]
"share/fulcrum/skills/uninstall/agents" = ["skills/uninstall/agents/openai.yaml"]
"share/fulcrum/skills/vizier" = ["skills/vizier/SKILL.md"]
"share/fulcrum/skills/vizier/agents" = ["skills/vizier/agents/openai.yaml"]
"share/fulcrum/skills/warden" = ["skills/warden/SKILL.md"]
"share/fulcrum/skills/warden/agents" = ["skills/warden/agents/openai.yaml"]
"share/fulcrum/skills/weaver" = ["skills/weaver/SKILL.md"]
"share/fulcrum/skills/weaver/agents" = ["skills/weaver/agents/openai.yaml"]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "pyre-check==0.10.0",
]

[project.scripts]
fulcrum = "fulcrum.bootstrap:main"
fulcrum-broker = "fulcrum.broker:main"
fulcrum-mcp = "fulcrum.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
